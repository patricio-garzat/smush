  time += dt;
  perf(raw, dt);
  for (let i = timers.length - 1; i >= 0; i--) if (timers[i].at <= time) { const f = timers[i].fn; timers.splice(i, 1); f(); }
  if (playing) spawnStep(dt);
  updateBalls(dt);
  updateVortices(dt);
  updateMeteors(dt);
  updateWaves(dt);
  updateHelpers(dt);
  updateMult(dt);
  if (playing && save.tool === "spray") for (const p of pointers.values()) sprayTick(p, dt);
  if (playing && save.tool === "laser") for (const p of pointers.values()) laserTick(p);
  if (playing && save.tool === "sun") for (const p of pointers.values()) sunTick(p, dt);
  while (beam.length && time - beam[0].t > 0.3) beam.shift();
  updateFx(dt);
  render(dt);
  updateCooldownUI();
  tweenCoins(dt);
  if (uiDirty) updateUI();
}
function startLoop() { if (!raf && !document.hidden) { last = 0; raf = requestAnimationFrame(loop); } }
// Pausa total cuando la pestaña o la app no se ven; al volver se cuenta lo que hicieron los ayudantes
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { cancelAnimationFrame(raf); raf = 0; pointers.clear(); writeSave(); hiddenAt = Date.now(); }
  else { startLoop(); if (hiddenAt) { checkAway(hiddenAt); hiddenAt = 0; } }
});
window.addEventListener("pagehide", writeSave);
new ResizeObserver(resize).observe(field);
window.addEventListener("resize", resize);

/* ---------- 14. Intros: BluBer (4 s, sobre blanco) y luego la de SMUSH! ---------- */
// Intro del estudio, copiada de Cube Swipe: el oso aparece, "BluBer" sube letra por letra, "GAMES" se abre, brillo y parpadeo
function playStudio(el, next, onStart) {
  const q = (id) => document.getElementById(id);
  const easeOutC = "cubic-bezier(.16,1,.3,1)", inOut = "cubic-bezier(.65,0,.35,1)";
  const tl = (node, frames, delay, duration, easing = easeOutC, fill = "both") => {
    node.style.transformBox = "fill-box";
    return node.animate(frames, { delay, duration, easing, fill });
  };
  const finish = () => {
    document.documentElement.classList.remove("studio-paper");
    document.querySelectorAll(".fixed-off").forEach((n) => n.classList.remove("fixed-off"));
    setBarColor("");
    nativeBar();
    next();
    const out = el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 450, easing: "cubic-bezier(.4,0,.2,1)", fill: "forwards" });
    out.onfinish = () => el.remove();
  };
  const setBarColor = (col) => {
    const root = document.documentElement;
    const c = col || getComputedStyle(root).getPropertyValue("--bg").trim();
    root.style.backgroundColor = c;
    document.body.style.backgroundColor = col;
    document.querySelectorAll('meta[name="theme-color"]').forEach((m) => { m.removeAttribute("media"); m.setAttribute("content", c); });
  };
  let begun = false;
  const begin = () => {
    if (begun) return;
    begun = true;
    el.classList.add("paper");
    if (isNative()) { setTimeout(run, 200); return; }
    document.documentElement.classList.add("studio-paper");
    document.querySelectorAll("body *").forEach((n) => { if (n !== el && getComputedStyle(n).position === "fixed") n.classList.add("fixed-off"); });
    setBarColor("#FFFFFF");
    setTimeout(run, 450);
  };
  if (document.readyState === "complete") setTimeout(begin, 250);
  else window.addEventListener("load", () => setTimeout(begin, 250), { once: true });
  setTimeout(begin, 2500);
  function run() {
    if (onStart) onStart();
    if (reduceMotion || !el.animate) { el.classList.add("go"); setTimeout(finish, 1600); return; }
    const ws = q("bb-word-shape");
    el.querySelectorAll("#bb-word path").forEach((l) => ws.appendChild(l.cloneNode()));
    const all = q("bb-all"); all.style.transformOrigin = "center";
    tl(all, [{ transform: "scale(0.955)" }, { transform: "scale(1)" }], 0, 4000, "cubic-bezier(.22,.6,.2,1)");
    const bear = q("bb-bear"); bear.style.transformOrigin = "50% 100%";
    tl(bear, [{ transform: "translateY(19px) scale(0.965)", opacity: 0 }, { transform: "none", opacity: 1 }], 250, 1000, "cubic-bezier(.25,.1,.25,1)");
    el.querySelectorAll("#bb-word path").forEach((l, i) => tl(l, [{ transform: "translateY(340px)" }, { transform: "translateY(0)" }], 1200 + i * 70, 760));
    const gm = [...el.querySelectorAll("#bb-games path")], boxes = gm.map((g) => g.getBBox());
    const cx = (boxes[0].x + boxes[4].x + boxes[4].width) / 2;
    gm.forEach((g, i) => {
      const dx = (cx - (boxes[i].x + boxes[i].width / 2)) * 0.75;
      tl(g, [{ transform: `translateX(${dx}px)`, opacity: 0 }, { transform: "translateX(0)", opacity: 1 }], 1950 + Math.abs(i - 2) * 70, 800);
    });
    tl(q("bb-sweep"), [{ transform: "translateX(0) skewX(-18deg)" }, { transform: "translateX(2230px) skewX(-18deg)" }], 2800, 900, inOut);
    tl(bear, [{ transform: "rotate(0deg)" }, { transform: "rotate(-2.6deg)", offset: 0.45 }, { transform: "rotate(-2.6deg)", offset: 0.65 }, { transform: "rotate(0deg)" }], 2700, 1000, inOut, "none");
    const eye = q("bb-eye"); eye.style.transformOrigin = "center";
    tl(eye, [{ transform: "scaleY(1)" }, { transform: "scaleY(0.12)", offset: 0.5 }, { transform: "scaleY(1)" }], 3250, 200, "ease-in-out", "none");
    el.classList.add("go");
    setTimeout(finish, 4000);
  }
}

// Intro de SMUSH!: los cuatro marcianitos caen (thump + vibración), aparece el nombre y se aplastan uno por uno
function playSplash(done) {
  const sp = $("#splash"), drops = sp.querySelector(".drops"), word = sp.querySelector(".word");
  const heights = { green: 50, orange: 40, purple: 62, yellow: 40 };
  drops.innerHTML = TYPE_ORDER.map((k) => `<img alt="" height="${heights[k]}" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(ALIENS[k].svg)}">`).join("");
  const dots = [...drops.children];
  const end = () => {
    const out = sp.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 450, easing: "ease", fill: "forwards" });
    out.onfinish = () => sp.remove();
    done();
  };
  if (reduceMotion || !sp.animate) {
    dots.forEach((d) => (d.style.opacity = 1)); word.style.opacity = 1;
    setTimeout(end, 1100); return;
  }
  dots.forEach((d, i) => {
    const at = 150 + i * 120;
    d.animate([{ transform: "translateY(-46vh)", opacity: 0 }, { transform: "translateY(-46vh)", opacity: 1, offset: 0.01 }, { transform: "translateY(0)", opacity: 1 }],
      { delay: at, duration: 520, easing: "cubic-bezier(.55,0,.85,.35)", fill: "both" });
    // Al tocar el piso se asienta un poco (sin rebote)
    d.animate([{ transform: "scale(1.14, .82)" }, { transform: "scale(1)" }], { delay: at + 520, duration: 280, easing: "cubic-bezier(.2,.8,.3,1)" });
    setTimeout(() => { Sound.drop(); buzz(9); }, at + 520);
    // Más tarde, cada uno se aplasta con su pop
    const popAt = 1550 + i * 95;
    d.animate([{ transform: "scale(1)", opacity: 1 }, { transform: "scale(1.4, .45)", opacity: 1, offset: 0.35 }, { transform: "scale(.3, .08)", opacity: 0 }],
      { delay: popAt, duration: 260, easing: "cubic-bezier(.3,.7,.3,1)", fill: "forwards" });
    setTimeout(() => { Sound.pop(TYPE_ORDER[i]); buzz(7); }, popAt + 60);
  });
  word.animate([{ opacity: 0, transform: "translateY(10px)" }, { opacity: 1, transform: "none" }], { delay: 700, duration: 600, easing: "cubic-bezier(.2,.8,.3,1)", fill: "both" });
  word.animate([{ transform: "scale(1)" }, { transform: "scale(1.03, .96)" }, { transform: "scale(1)" }], { delay: 1930, duration: 280, easing: "ease-out" });
  setTimeout(end, 2500);
}

function startGame() {
  playing = true;
  populate();
  if (!save.hinted) $("#hint").classList.add("on");
  if (save.pending) setTimeout(showWelcome, 500);
}

(function boot() {
  readPalette();
  applyTheme();
  applyLevel();
  applyLang();
  resize();
  syncHelpers();
  checkAway(save.lastSeen);
  writeSave();
  loadArt().then(() => { buildSprites(); });
  startLoop();
  const studio = $("#studio");
  // La intro del estudio arranca sola. Si el navegador ya deja sonar, suena desde el inicio;
  // si pide un toque primero, el sonido entra en cuanto la persona toca.
  let t0 = null, pending = false, sounding = false;
  const onStart = () => { t0 = performance.now(); if (pending) { pending = false; Sound.studio(0); } };
  const afterStudio = () => playSplash(startGame);
  if (studio) playStudio(studio, afterStudio, onStart); else { onStart(); afterStudio(); }
  if (!settings.sound) return;
  if (Sound.probe()) { if (t0 === null) pending = true; else Sound.studio(0); return; }
  const late = () => {
    if (sounding) return;
    Sound.unlock();
    Sound.whenRunning(() => {
      if (sounding) return;
      sounding = true;
      ["pointerdown", "touchend", "click", "keydown"].forEach((ev) => document.removeEventListener(ev, late, true));
      if (!studio || !studio.isConnected) return;
      if (t0 === null) pending = true; else Sound.studio((performance.now() - t0) / 1000);
    });
  };
  ["pointerdown", "touchend", "click", "keydown"].forEach((ev) => document.addEventListener(ev, late, true));
})();
