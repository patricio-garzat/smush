<!doctype html>
<!-- Arma una imagen de la App Store (captura con título, o Header / Search Results). La abre store/make_store.py
     en Chrome sin ventana con ?kind=…&… y toma la foto del tamaño exacto. -->
<meta charset="utf-8">
<style>
@font-face { font-family: "Outfit"; src: url("../fonts/outfit.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Jakarta"; src: url("../fonts/jakarta.woff2") format("woff2"); font-weight: 200 800; }
html, body { margin: 0; overflow: hidden; }
#c { position: relative; overflow: hidden; isolation: isolate;
  background: radial-gradient(70% 55% at 50% 30%, rgba(84, 170, 255, .55), rgba(84, 170, 255, 0) 70%),
              radial-gradient(140% 120% at 50% 35%, rgba(8, 24, 90, 0) 55%, rgba(8, 24, 90, .5) 100%),
              linear-gradient(170deg, #4DB3FF 0%, #1F74E8 46%, #123FAE 100%); }
#c > * { position: absolute; }
.rays { border-radius: 50%; opacity: .55; background: repeating-conic-gradient(from 4deg, rgba(255, 255, 255, .22) 0deg 6deg, rgba(255, 255, 255, 0) 6deg 20deg);
  -webkit-mask: radial-gradient(closest-side, rgba(0,0,0,.4) 4%, #000 22%, rgba(0,0,0,.45) 45%, transparent 66%); }
.ring { border-radius: 50%; border: solid rgba(255, 255, 255, .16); }
.bub { border-radius: 50%; background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.85), rgba(255,255,255,.18) 45%, rgba(255,255,255,.04) 70%); box-shadow: inset 0 0 0 2px rgba(255,255,255,.3); }
.spark { fill: #fff; filter: drop-shadow(0 0 10px rgba(255,255,255,.9)); }
.spark.gold { fill: #FFF1A8; filter: drop-shadow(0 0 14px rgba(255,228,120,.95)); }
.cloud { left: -5%; right: -5%; bottom: -3%; opacity: .22;
  background: radial-gradient(28% 60% at 8% 75%, #fff 55%, transparent 57%), radial-gradient(24% 66% at 28% 82%, #fff 55%, transparent 57%), radial-gradient(28% 64% at 50% 86%, #fff 55%, transparent 57%), radial-gradient(24% 70% at 72% 80%, #fff 55%, transparent 57%), radial-gradient(28% 62% at 94% 74%, #fff 55%, transparent 57%); }
.cap { left: 0; right: 0; text-align: center; color: #fff; font-family: "Outfit"; font-weight: 800; letter-spacing: -0.02em; line-height: 1.02;
  text-shadow: 0 .05em 0 #0E3A8C, 0 .14em .3em rgba(4, 16, 70, .45); }
.cap b { color: #FFD45C; font-weight: 800; }
.sub { left: 0; right: 0; text-align: center; color: rgba(235, 245, 255, .92); font-family: "Jakarta"; font-weight: 700; letter-spacing: -0.005em; text-shadow: 0 2px 10px rgba(4, 16, 70, .35); }
.dev { background: linear-gradient(160deg, #2A3142, #0B0F1A 60%, #1A2030); box-shadow: 0 0 0 2px rgba(255,255,255,.18), 0 40px 80px rgba(4, 14, 60, .55), 0 12px 24px rgba(4, 14, 60, .35); }
.dev img { position: absolute; display: block; }
.icon { border-radius: 22.5%; box-shadow: 0 30px 60px rgba(4, 14, 60, .5), 0 8px 18px rgba(4, 14, 60, .3), 0 0 0 3px rgba(255,255,255,.25); }
.logo { filter: drop-shadow(0 6px 0 #0E3A8C) drop-shadow(0 26px 34px rgba(4, 16, 70, .55)); }
.tag { color: #fff; font-family: "Outfit"; font-weight: 700; letter-spacing: -0.01em; text-shadow: 0 4px 0 #0E3A8C, 0 12px 30px rgba(4,16,70,.45); white-space: nowrap; }
.alien { filter: drop-shadow(0 18px 24px rgba(4, 14, 60, .45)); }
</style>
<div id="c"></div>
<script>
const q = new URLSearchParams(location.search), $c = document.getElementById("c");
const W = +q.get("w"), H = +q.get("h"), kind = q.get("kind");
$c.style.width = W + "px"; $c.style.height = H + "px";
const el = (tag, cls, css, html) => { const e = document.createElement(tag); if (cls) e.className = cls; e.style.cssText = css || ""; if (html) e.innerHTML = html; $c.appendChild(e); return e; };
const spark = (x, y, s, gold) => el("div", "", `left:${x - s / 2}px;top:${y - s / 2}px;width:${s}px;height:${s}px`, `<svg class="spark${gold ? " gold" : ""}" viewBox="-50 -50 100 100" width="${s}" height="${s}"><path d="M0-50C4-14 14-4 50 0 14 4 4 14 0 50-4 14-14 4-50 0-14-4-4-14 0-50Z"/></svg>`);
const bub = (x, y, s) => el("div", "bub", `left:${x - s / 2}px;top:${y - s / 2}px;width:${s}px;height:${s}px`);
const ring = (x, y, r, w, a) => el("div", "ring", `left:${x - r}px;top:${y - r}px;width:${r * 2}px;height:${r * 2}px;border-width:${w}px;opacity:${a}`);
function sky(cx, cy, R) {
  el("div", "rays", `left:${cx - R}px;top:${cy - R}px;width:${R * 2}px;height:${R * 2}px`);
  ring(cx, cy, R * 0.42, Math.max(2, R * 0.004), 1); ring(cx, cy, R * 0.62, Math.max(2, R * 0.003), .6);
  el("div", "cloud", `height:${H * 0.16}px`);
}
const ALIEN = { green: [168.2, 124.2, 537.2, 615.3], orange: [250.7, 286.1, 457.9, 563.9], purple: [98.5, 32.9, 720.8, 783.4], yellow: [200.1, 130.1, 600, 669.9] };
function alien(n, cx, by, w, rot = 0) { // marcianito de frente (dibujo del juego), por el centro y el pie de su caja
  const b = ALIEN[n], k = w / (b[2] - b[0]), S = 800 * k;
  el("img", "alien", `left:${cx - ((b[0] + b[2]) / 2) * k}px;top:${by - b[3] * k}px;width:${S}px;height:${S}px;transform:rotate(${rot}deg)`).src = "../tools/front/" + n + ".svg";
}

if (kind === "shot") {
  // Captura con título: ?kind=shot&w&h&img&cap&sub&dev=phone|ipad
  const dev = q.get("dev"), img = q.get("img"), phone = dev === "phone";
  const u = W / (phone ? 660 : 1376); // unidad (todo se escribió para 660 px de ancho en celular y 1376 en iPad)
  sky(W / 2, phone ? H * 0.5 : H * 0.55, Math.max(W, H) * 0.95);
  const capSize = (phone ? 62 : 64) * u, top = (phone ? 92 : 44) * u;
  const cap = el("div", "cap", `top:${top}px;font-size:${capSize}px;padding:0 ${phone ? 40 * u : 0}px`, q.get("cap"));
  const sub = el("div", "sub", `top:${top + cap.offsetHeight + 18 * u}px;font-size:${(phone ? 25 : 28) * u}px;padding:0 ${44 * u}px`, q.get("sub"));
  const bz = (phone ? 13 : 16) * u, sw = phone ? 486 * u : 1010 * u, sh = phone ? sw * 874 / 402 : sw * 820 / 1180;
  const dt = top + cap.offsetHeight + sub.offsetHeight + (phone ? 64 : 34) * u;
  const d = el("div", "dev", `left:${(W - sw) / 2 - bz}px;top:${dt}px;width:${sw + bz * 2}px;height:${sh + bz * 2}px;border-radius:${(phone ? 70 : 44) * u}px`);
  const im = document.createElement("img"); im.src = img; im.style.cssText = `left:${bz}px;top:${bz}px;width:${sw}px;height:${sh}px;border-radius:${(phone ? 58 : 30) * u}px`; d.appendChild(im);
  // adornos alrededor (sin tapar la captura)
  spark(W * 0.9, top + capSize * 0.2, 46 * u, true); spark(W * 0.08, top + capSize * 1.4, 30 * u); spark(W * 0.94, dt + sh * 0.35, 24 * u);
  bub(W * 0.06, dt + sh * 0.22, 44 * u); bub(W * 0.95, dt + sh * 0.62, 56 * u); bub(W * 0.12, top - 30 * u, 26 * u);
} else {
  // Header (3840 x 1646) y Search Results (3840 x 2560): ícono 3D + logo + frase dentro de la zona segura;
  // cielo, marcianitos, burbujas y destellos hasta las orillas.
  const S = q.get("safe").split(",").map(Number), [sx, sy, swd, shg] = S, cy = sy + shg / 2;
  sky(W / 2, cy, W * 0.62);
  const iconH = shg * (kind === "header" ? 1 : 0.96), gap = iconH * 0.12;
  const logoW = swd - iconH - gap, logoH = logoW * 370 / 920; // logo-dark.svg: viewBox 920 x 370
  const tagSize = iconH * (kind === "header" ? 0.105 : 0.1);
  const blockH = logoH + tagSize * 1.5, x0 = sx;
  const ic = el("img", "icon", `left:${x0}px;top:${cy - iconH / 2}px;width:${iconH}px;height:${iconH}px`); ic.src = "../brand/icon-3d-source.png";
  const lg = el("img", "logo", `left:${x0 + iconH + gap}px;top:${cy - blockH / 2}px;width:${logoW}px;height:${logoH}px`); lg.src = "../brand/logo-dark.svg";
  el("div", "tag", `left:${x0 + iconH + gap}px;width:${logoW}px;text-align:center;top:${cy - blockH / 2 + logoH + tagSize * 0.25}px;font-size:${tagSize}px`, q.get("tag"));
  // Marcianitos de frente fuera de la zona segura, flotando a los lados
  const a = H / 1646;
  if (kind === "header") {
    alien("green", sx * 0.42, H * 0.86, 300 * a, -8); alien("orange", sx * 0.78, H * 0.52, 150 * a, 10);
    alien("yellow", W - sx * 0.4, H * 0.84, 290 * a, 7); alien("purple", W - sx * 0.82, H * 0.5, 210 * a, -9);
  } else {
    alien("green", sx * 0.45, H * 0.9, 330 * a * 0.8, -8); alien("orange", sx * 0.62, H * 0.3, 170 * a * 0.8, 10);
    alien("yellow", W - sx * 0.42, H * 0.92, 320 * a * 0.8, 7); alien("purple", W - sx * 0.6, H * 0.32, 240 * a * 0.8, -9);
  }
  spark(sx * 0.3, H * 0.2, 90 * a, true); spark(W - sx * 0.25, H * 0.18, 70 * a); spark(sx * 0.95, H * 0.88, 50 * a); spark(W - sx * 1.05, H * 0.9, 56 * a, true);
  bub(sx * 0.15, H * 0.5, 120 * a); bub(W - sx * 0.12, H * 0.55, 140 * a); bub(W * 0.5, H * 0.06, 70 * a);
}
</script>
